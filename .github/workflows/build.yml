name: Build and Release

# ═══════════════════════════════════════════════════════════════════
# ТРИ СПОСОБИ ВИПУСТИТИ РЕЛІЗ
#
# 1. ОНЛАЙН, без git і без вводу версії:
#      Actions → Build and Release → Run workflow → Run
#      Версія підніметься сама від останнього релізу (3.1.0 → 3.1.1)
#
# 2. ОНЛАЙН із конкретною версією:
#      Actions → Run workflow → вписати 3.2.0 → Run
#
# 3. ТЕГОМ з консолі:
#      git tag v3.1.1 && git push origin v3.1.1
#
# Звичайний push у main релізу НЕ створює — тільки швидку перевірку.
# ═══════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (напр. 3.2.0). Лишіть порожнім — підніметься автоматично'
        required: false
        default: ''
      bump:
        description: 'Наскільки піднімати, якщо версію не вказано'
        required: false
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────────────────────────
  # Швидка перевірка на кожен push у main. Релізу не створює.
  # ─────────────────────────────────────────────────────────────────
  check:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Залежності
        run: npm install
      - name: Синтаксис
        run: |
          node --check main.js
          for f in svarog-*.js; do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          echo "✅ Готово до релізу"

  # ─────────────────────────────────────────────────────────────────
  # Версія рахується ОДИН раз в окремій джобі.
  # Інакше Windows і macOS порахували б її незалежно і могли
  # розійтись (одна 3.1.1, друга 3.1.2).
  # ─────────────────────────────────────────────────────────────────
  version:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Визначити версію
        id: calc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          # 1) Реліз за тегом — версія з тега
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Джерело: тег ${GITHUB_REF_NAME}"

          # 2) Версію вписали вручну
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Джерело: ручний ввід"

          # 3) Порожньо — піднімаємо від останнього релізу на GitHub
          else
            LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
            LATEST="${LATEST#v}"

            if [ -z "$LATEST" ]; then
              LATEST=$(node -p "require('./package.json').version")
              echo "Релізів ще немає — беру версію з package.json: $LATEST"
            else
              echo "Останній реліз: v$LATEST"
            fi

            BUMP="${{ github.event.inputs.bump }}"
            BUMP="${BUMP:-patch}"

            MAJOR=$(echo "$LATEST" | cut -d. -f1)
            MINOR=$(echo "$LATEST" | cut -d. -f2)
            PATCH=$(echo "$LATEST" | cut -d. -f3)
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}

            case "$BUMP" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              *)     PATCH=$((PATCH+1)) ;;
            esac

            VERSION="$MAJOR.$MINOR.$PATCH"
            echo "Піднімаю ($BUMP): $LATEST → $VERSION"
          fi

          # Захист: такий реліз уже існує?
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Реліз v$VERSION вже існує. Вкажіть іншу версію."
            exit 1
          fi

          echo "══════════════════════════════"
          echo "  ВЕРСІЯ РЕЛІЗУ: $VERSION"
          echo "══════════════════════════════"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Реліз створюємо ОДИН раз тут, чернеткою.
      # Інакше Windows і macOS стартують одночасно і обидві намагаються
      # створити той самий реліз — той, хто прийшов другим, отримує
      # 422 "already_exists". Тепер обидві просто доливають файли
      # у вже готову чернетку.
      - name: Створити чернетку релізу
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.calc.outputs.version }}" \
            --draft \
            --title "SVAROG v${{ steps.calc.outputs.version }}" \
            --notes "Автоматична збірка. Файли зʼявляться, щойно завершаться Windows і macOS." \
            --target "${GITHUB_SHA}"
          echo "Чернетку v${{ steps.calc.outputs.version }} створено"

  # ─────────────────────────────────────────────────────────────────
  # Збірка й публікація
  # ─────────────────────────────────────────────────────────────────
  release:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # electron-builder бере версію саме з package.json
      - name: Підставити версію ${{ needs.version.outputs.version }}
        shell: bash
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # ═══════════════════════════════════════════════════════════════
      # Куди публікувати реліз.
      #
      # Раніше owner/repo були жорстко вписані в package.json і вказували
      # на СТОРОННІЙ репозиторій. GITHUB_TOKEN має права тільки на той
      # репозиторій, де йде збірка, тому GitHub відповідав:
      #     403 "Resource not accessible by integration"
      # Збірка проходила, а публікація падала.
      #
      # Тепер адреса береться з самого запуску — розʼїхатись не може.
      # ═══════════════════════════════════════════════════════════════
      - name: Вказати репозиторій для публікації
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const [owner, repo] = process.env.REPO.split('/');
            pkg.build = pkg.build || {};
            pkg.build.publish = {
              provider: 'github',
              owner: owner,
              repo: repo,
              releaseType: 'release'
            };
            pkg.repository = { type: 'git', url: 'https://github.com/' + process.env.REPO + '.git' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Публікую в: ' + owner + '/' + repo);
          "

      - name: Залежності
        run: npm install

      - name: Збірка Windows
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Збірка macOS
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Резервна копія артефактів
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.yml
          retention-days: 5
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────
  # Обидві збірки долили свої файли в чернетку — тепер публікуємо.
  # Доти реліз не видно нікому, тож користувач не завантажить
  # напівпорожній реліз без .dmg чи без .exe.
  # ─────────────────────────────────────────────────────────────────
  publish:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Опублікувати реліз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          FILES=$(gh release view "v$VERSION" --json assets --jq '.assets | length')
          echo "Файлів у релізі: $FILES"
          if [ "$FILES" -eq 0 ]; then
            echo "::error::Реліз порожній — збірки нічого не залили. Не публікую."
            exit 1
          fi
          gh release edit "v$VERSION" --draft=false --latest
          echo "✅ Реліз v$VERSION опубліковано"
          gh release view "v$VERSION" --json assets --jq '.assets[].name'
